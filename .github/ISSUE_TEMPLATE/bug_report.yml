name: Bug report
description: Something is wrong or does not render as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please scrub prompts, paths, and secrets from anything you paste.
  - type: input
    id: version
    attributes:
      label: AgentLens version
      placeholder: 0.1.0 or commit sha
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [Claude Code, Codex, Both, Not provider specific]
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a run with …
        2. Click …
  - type: textarea
    id: sample
    attributes:
      label: Minimal log excerpt (optional, scrubbed)
      description: A few JSONL lines that trigger the problem, with paths and prompts replaced by placeholders.
      render: json
